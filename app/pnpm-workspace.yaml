# pnpm 11 以降は、依存のインストール時スクリプトを allowBuilds で許可する（package.json の pnpm.onlyBuiltDependencies は効かない）。
# 許可も拒否もしていないスクリプトがあると、pnpm 12 は install をエラーで止める。
# electron 44 のパッケージにはインストール時スクリプトがないので、ここには書かない（本体は package.json の postinstall で取りに行く）
allowBuilds:
  esbuild: true
  # electron-builder が使う Windows の Squirrel 形式のインストーラー用。Trueful では使わないので実行しない
  electron-winstaller: false

# http-cache-semantics <=4.2.0 の脆弱性（GHSA-ch52-4w7c-c8xp）。electron-builder → @electron/get → got → cacheable-request が古い版を引く
overrides:
  http-cache-semantics: "^4.3.0"
